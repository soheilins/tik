name: Fetch & Commit TikTok Videos (Incremental)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'TikTok Username (without @)'
        required: true
      max_videos:
        description: 'Number of recent videos to check'
        required: true
        default: '50'

permissions:
  contents: write

jobs:
  download-new-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Get existing video IDs from repo
        id: existing
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          mkdir -p "videos/$USERNAME"
          EXISTING_IDS=""
          for f in videos/$USERNAME/*.mp4; do
            if [ -f "$f" ]; then
              id=$(basename "$f" .mp4 | sed 's/.*_//')
              EXISTING_IDS="$EXISTING_IDS $id"
            fi
          done
          for d in videos/$USERNAME/*_chunks/; do
            if [ -d "$d" ]; then
              id=$(basename "$d" | sed 's/_chunks//')
              EXISTING_IDS="$EXISTING_IDS $id"
            fi
          done
          echo "$EXISTING_IDS" | tr ' ' '\n' > existing_ids.txt
          echo "Found $(wc -l < existing_ids.txt) existing videos"

      - name: Get new video URLs (skip existing)
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          MAX="${{ github.event.inputs.max_videos }}"
          yt-dlp --flat-playlist --print "%(url)s %(id)s" "https://www.tiktok.com/@$USERNAME" 2>/dev/null | head -n $MAX > video_list.txt
          > new_urls.txt
          while read url id; do
            if ! grep -qx "$id" existing_ids.txt; then
              echo "$url" >> new_urls.txt
            fi
          done < video_list.txt
          echo "New videos to download: $(wc -l < new_urls.txt)"

      - name: Download and store (timestamp + ID filename + title file)
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          mkdir -p "videos/$USERNAME"
          if [ ! -s new_urls.txt ]; then
            echo "No new videos to download."
            exit 0
          fi
          while read url; do
            echo "Downloading new video: $url"
            yt-dlp -o "temp_video.%(ext)s" "$url"
            VIDEO_FILE=$(ls temp_video.* 2>/dev/null | head -1)
            if [ -f "$VIDEO_FILE" ]; then
              FILE_SIZE=$(stat -c%s "$VIDEO_FILE")
              VIDEO_ID=$(yt-dlp --print id "$url")
              VIDEO_TITLE=$(yt-dlp --print title "$url" || echo "Untitled")
              # Clean forward slashes for safety
              VIDEO_TITLE_CLEAN=$(echo "$VIDEO_TITLE" | sed 's:/:-:g')
              TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
              SAFE_BASENAME="${TIMESTAMP}_${VIDEO_ID}"
              if [ $FILE_SIZE -gt $((100 * 1024 * 1024)) ]; then
                echo "  File size >100MB, adding URL to over100.txt"
                echo "https://www.tiktok.com/@$USERNAME/video/$VIDEO_ID -> $VIDEO_TITLE_CLEAN" >> "videos/$USERNAME/over100.txt"
              else
                echo "  File size <=100MB, saving as ${SAFE_BASENAME}.mp4"
                cp "$VIDEO_FILE" "videos/$USERNAME/${SAFE_BASENAME}.mp4"
                # Save original title
                echo "$VIDEO_TITLE" > "videos/$USERNAME/${SAFE_BASENAME}.title.txt"
              fi
              rm "$VIDEO_FILE"
            else
              echo "  Failed to download $url"
            fi
          done < new_urls.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/
          git add existing_ids.txt
          git diff --staged --quiet || git commit -m "Update TikTok videos for @${{ github.event.inputs.username }}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
