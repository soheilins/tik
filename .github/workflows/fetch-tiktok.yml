name: Fetch & Commit TikTok Videos

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'TikTok Username (without @)'
        required: true
      max_videos:
        description: 'Number of videos to download'
        required: true
        default: '50'

permissions:
  contents: write

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Get video URLs
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          MAX="${{ github.event.inputs.max_videos }}"
          yt-dlp --flat-playlist --print url "https://www.tiktok.com/@$USERNAME" 2>/dev/null | head -n $MAX > urls.txt
          echo "Found $(wc -l < urls.txt) URLs"

      - name: Download, split if >100MB, and store
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          mkdir -p "videos/$USERNAME"
          CHUNK_SIZE=5M   # 5 MB per chunk

          while read url; do
            echo "Downloading $url"
            # Download to a temp file
            yt-dlp -o "temp_video.%(ext)s" "$url"
            # Get the actual file name
            VIDEO_FILE=$(ls temp_video.* 2>/dev/null | head -1)
            if [ -f "$VIDEO_FILE" ]; then
              FILE_SIZE=$(stat -c%s "$VIDEO_FILE")
              # Extract video ID from filename (yt-dlp includes ID)
              VIDEO_ID=$(yt-dlp --print id "$url")
              VIDEO_TITLE=$(yt-dlp --print title "$url" | tr -d '/' | cut -c1-50)
              if [ $FILE_SIZE -gt $((100 * 1024 * 1024)) ]; then
                echo "  File size >100MB, splitting into ${CHUNK_SIZE} chunks"
                mkdir -p "videos/$USERNAME/${VIDEO_ID}_chunks"
                split -b $CHUNK_SIZE -d "$VIDEO_FILE" "videos/$USERNAME/${VIDEO_ID}_chunks/chunk_"
                # Save metadata
                echo "$VIDEO_TITLE" > "videos/$USERNAME/${VIDEO_ID}_chunks/title.txt"
                echo "$VIDEO_ID" > "videos/$USERNAME/${VIDEO_ID}_chunks/id.txt"
              else
                echo "  File size <=100MB, saving directly"
                cp "$VIDEO_FILE" "videos/$USERNAME/${VIDEO_TITLE}_${VIDEO_ID}.mp4"
              fi
              rm "$VIDEO_FILE"
            else
              echo "  Failed to download $url"
            fi
          done < urls.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/
          git add urls.txt
          git diff --staged --quiet || git commit -m "TikTok videos for @${{ github.event.inputs.username }}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
