name: Fetch & Commit TikTok Videos

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'TikTok Username (without @)'
        required: true
      max_videos:
        description: 'Number of videos to download'
        required: true
        default: '50'

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yt-dlp with impersonation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools
          pip install --upgrade pip
          pip install yt-dlp[default] curl_cffi

      - name: Get video URLs
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          MAX="${{ github.event.inputs.max_videos }}"
          yt-dlp --flat-playlist --print url "https://www.tiktok.com/@$USERNAME" 2>/dev/null | head -n $MAX > urls.txt
          echo "Found $(wc -l < urls.txt) URLs"

      - name: Download videos (with retry and impersonation)
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          mkdir -p "videos/$USERNAME"
          
          # Pass 1: Initial download
          echo "=== Pass 1: Initial download ==="
          while read url; do
            echo "Downloading $url"
            if ! yt-dlp --impersonate chrome -o "videos/$USERNAME/%(title).60s_%(id)s.%(ext)s" "$url"; then
              echo "$url" >> failed.txt
            fi
          done < urls.txt
          
          # Pass 2: Retry failed downloads
          if [ -f failed.txt ] && [ -s failed.txt ]; then
            echo "=== Pass 2: Retrying failed downloads ==="
            while read url; do
              echo "Retrying $url"
              yt-dlp --impersonate chrome -o "videos/$USERNAME/%(title).60s_%(id)s.%(ext)s" "$url"
            done < failed.txt
            rm failed.txt
          else
            echo "No failed downloads to retry"
          fi
          
          echo "Download complete. Files in videos/$USERNAME/:"
          ls -lh "videos/$USERNAME/"

      - name: Commit and push videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/
          git add urls.txt
          git diff --staged --quiet || git commit -m "Add TikTok videos for @${{ github.event.inputs.username }}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
