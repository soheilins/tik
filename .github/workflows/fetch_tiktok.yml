name: Fetch TikTok Videos (yt-dlp)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'TikTok Username (without @)'
        required: true
        default: 'im.stary.neco'
      max_videos:
        description: 'Number of recent videos'
        required: true
        default: '20'

jobs:
  fetch-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          sudo apt update
          sudo apt install -y ffmpeg   # optional, but recommended
          pip install yt-dlp

      - name: Extract recent video links
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          MAX_COUNT="${{ github.event.inputs.max_videos }}"
          echo "Fetching $MAX_COUNT videos from @$USERNAME"
          
          # Get video URLs (flat playlist, only URLs)
          yt-dlp --flat-playlist --print url "https://www.tiktok.com/@$USERNAME" | head -n $MAX_COUNT > recent_video_links.txt
          
          echo "Done. Saved $(wc -l < recent_video_links.txt) URLs."

      - name: Commit and push the file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recent_video_links.txt
          git diff --staged --quiet || git commit -m "Update TikTok video links for @${{ github.event.inputs.username }}"
          git push
