name: Fetch TikTok Videos (yt-dlp)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'TikTok Username (without @)'
        required: true
        default: 'im.stary.neco'
      max_videos:
        description: 'Number of recent videos'
        required: true
        default: '20'

# Give the workflow permission to push to the repository
permissions:
  contents: write

jobs:
  fetch-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Extract recent video links (suppress broken pipe warnings)
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          MAX_COUNT="${{ github.event.inputs.max_videos }}"
          echo "Fetching $MAX_COUNT videos from @$USERNAME"
          
          # 2>/dev/null hides the harmless "Broken pipe" errors
          yt-dlp --flat-playlist --print url "https://www.tiktok.com/@$USERNAME" 2>/dev/null | head -n $MAX_COUNT > recent_video_links.txt
          
          echo "Done. Saved $(wc -l < recent_video_links.txt) URLs."

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recent_video_links.txt
          git diff --staged --quiet || git commit -m "Update TikTok video links for @${{ github.event.inputs.username }}"
          # Use the built-in GITHUB_TOKEN for authentication
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
